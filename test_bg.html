<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    position: relative;
    width: 800px;
    height: 400px;
    background: url('https://picsum.photos/800/400') no-repeat;
    background-size: 100% 100%;
  }
  .grid {
    position: absolute;
    top: 15%; bottom: 15%; left: 10%; right: 10%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  .cell {
    position: relative;
    box-sizing: border-box;
    border: 1px solid red;
    overflow: hidden;
  }
  .cell-inner {
    position: absolute;
    inset: 0;
    background-image: url('https://picsum.photos/800/400');
    background-size: 625% 285.71428%;
    transition: transform 0.3s;
  }
  .cell:hover .cell-inner {
    transform: scale(1.1);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="grid">
      <script>
        const cols = 5;
        const rows = 2;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const posX = ((10 + c * 16) / 84) * 100;
            const posY = ((15 + r * 35) / 65) * 100;
            document.write(\`<div class="cell"><div class="cell-inner" style="background-position: \${posX}% \${posY}%"></div></div>\`);
          }
        }
      </script>
    </div>
  </div>
</body>
</html>
